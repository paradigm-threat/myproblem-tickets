apiVersion: apps/v1
kind: Deployment
metadata:
  name: intake
  namespace: myproblem
  labels:
    app: myproblem-intake
spec:
  replicas: 1
  strategy:
    type: Recreate  # hostNetwork/hostPort — cannot RollingUpdate on one node
  selector:
    matchLabels:
      app: myproblem-intake
  template:
    metadata:
      labels:
        app: myproblem-intake
        relay.ai.intake: "on"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Single-node Intake Spot — do not pin hostname (Spot replaces instance ids).
      # Tip git lives on hostPath; one worker is enough for this stand.
      containers:
        - name: intake
          image: node:22-bookworm-slim
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              apt-get update -qq && apt-get install -y -qq git >/dev/null
              cp /code/package.json /app/package.json
              mkdir -p /app/workers/intake /app/workers/lib
              cp /code/server.mjs /app/workers/intake/server.mjs
              cp /code/wake-batch.mjs /app/workers/intake/wake-batch.mjs
              cp /code/gitTipStore.mjs /app/workers/lib/gitTipStore.mjs
              cp /code/suggestSlug.mjs /app/workers/lib/suggestSlug.mjs
              cp /code/bunnyMedia.mjs /app/workers/lib/bunnyMedia.mjs
              cp /code/piiConvert.mjs /app/workers/lib/piiConvert.mjs
              cp /code/ticketAuth.mjs /app/workers/lib/ticketAuth.mjs
              cp /code/asrAttempt.mjs /app/workers/lib/asrAttempt.mjs
              cp /code/visionAttempt.mjs /app/workers/lib/visionAttempt.mjs
              cp /code/safetyRestraint.mjs /app/workers/lib/safetyRestraint.mjs
              cp /code/confidenceGauge.mjs /app/workers/lib/confidenceGauge.mjs
              mkdir -p /data/regions /data/cache
              exec node workers/intake/server.mjs
          ports:
            - containerPort: 8787
              hostPort: 8787
              name: http
          env:
            - name: PORT
              value: "8787"
            - name: TICKETS_CACHE_DIR
              value: /data/cache
            - name: TICKETS_REGIONS_ROOT
              value: /data/regions
            - name: TICKETS_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: intake-secrets
                  key: TICKETS_API_SECRET
            - name: OPS_WAKE_SECRET
              valueFrom:
                secretKeyRef:
                  name: intake-secrets
                  key: OPS_WAKE_SECRET
            - name: REQUIRE_TICKET_CLAIM
              valueFrom:
                secretKeyRef:
                  name: intake-secrets
                  key: REQUIRE_TICKET_CLAIM
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: intake-secrets
                  key: GROQ_API_KEY
                  optional: true
          volumeMounts:
            - name: code
              mountPath: /code
            - name: regions
              mountPath: /data/regions
            - name: cache
              mountPath: /data/cache
          readinessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 40
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: code
          configMap:
            name: intake-code
        # Survive Recreate; emptyDir wiped tips on every rollout.
        - name: regions
          hostPath:
            path: /var/lib/myproblem-intake/regions
            type: DirectoryOrCreate
        # Ephemeral media cache — OK to lose on pod recreate.
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: intake
  namespace: myproblem
spec:
  selector:
    app: myproblem-intake
  ports:
    - port: 80
      targetPort: 8787
      name: http
  type: ClusterIP
