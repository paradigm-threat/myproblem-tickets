# Dual-domain TLS: api.clevertree.chat (Cleverchat) + intake.myproblem.app (tickets + chat paths)
# Chat host → :8790, tickets → :8787. hostNetwork: ACME HTTP-01 on :80, HTTPS on :443.
apiVersion: v1
kind: ConfigMap
metadata:
  name: intake-caddy
  namespace: myproblem
data:
  Caddyfile: |
    {
      email hostmaster@myproblem.app
    }

    api.clevertree.chat {
      encode gzip
      reverse_proxy 127.0.0.1:8790
    }

    intake.myproblem.app {
      encode gzip

      handle /chat* {
        reverse_proxy 127.0.0.1:8790
      }
      handle /api/chat* {
        reverse_proxy 127.0.0.1:8790
      }
      handle /fronts/snippet* {
        reverse_proxy 127.0.0.1:8790
      }
      handle /styles.css {
        reverse_proxy 127.0.0.1:8790
      }
      handle /icon-128x128.png {
        reverse_proxy 127.0.0.1:8790
      }
      handle /favicon.ico {
        reverse_proxy 127.0.0.1:8790
      }

      handle {
        reverse_proxy 127.0.0.1:8787
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intake-caddy
  namespace: myproblem
  labels:
    app: myproblem-intake-caddy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: myproblem-intake-caddy
  template:
    metadata:
      labels:
        app: myproblem-intake-caddy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Single-node Intake Spot — do not pin hostname (Spot replaces instance ids).
      containers:
        - name: caddy
          image: caddy:2.8-alpine
          ports:
            - containerPort: 80
              hostPort: 80
              name: http
            - containerPort: 443
              hostPort: 443
              name: https
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
          readinessProbe:
            # TCP only — HTTPS probe to the node IP fails SNI for intake.myproblem.app.
            tcpSocket:
              port: 443
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: caddyfile
          configMap:
            name: intake-caddy
        # Persist LE certs across Recreate (emptyDir loses ACME state).
        - name: data
          hostPath:
            path: /var/lib/myproblem-caddy
            type: DirectoryOrCreate
        - name: config
          emptyDir: {}
