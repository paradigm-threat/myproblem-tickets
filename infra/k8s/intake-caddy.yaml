# TLS terminator for intake.myproblem.app → commit worker :8787
# hostNetwork: ACME HTTP-01 on :80, HTTPS on :443.
apiVersion: v1
kind: ConfigMap
metadata:
  name: intake-caddy
  namespace: myproblem
data:
  Caddyfile: |
    {
      email hostmaster@myproblem.app
    }
    intake.myproblem.app {
      encode gzip
      reverse_proxy 127.0.0.1:8787
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intake-caddy
  namespace: myproblem
  labels:
    app: myproblem-intake-caddy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: myproblem-intake-caddy
  template:
    metadata:
      labels:
        app: myproblem-intake-caddy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: prod-instance-17941481574532202
      containers:
        - name: caddy
          image: caddy:2.8-alpine
          ports:
            - containerPort: 80
              hostPort: 80
              name: http
            - containerPort: 443
              hostPort: 443
              name: https
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
          readinessProbe:
            # TCP only — HTTPS probe to the node IP fails SNI for intake.myproblem.app.
            tcpSocket:
              port: 443
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: caddyfile
          configMap:
            name: intake-caddy
        # Persist LE certs across Recreate (emptyDir loses ACME state).
        - name: data
          hostPath:
            path: /var/lib/myproblem-caddy
            type: DirectoryOrCreate
        - name: config
          emptyDir: {}
